# Local services for Paper & Chalk. Only the throwaway test database runs here: development,
# tests and CI use the real cloud services (Atlas, Upstash, the S3 dev buckets).
# Host ports are chosen to avoid clashing with other local containers.
name: paper-chalk

services:
  # Throwaway MongoDB for tests and CI, as a single-node replica set so transactions work.
  # Development uses the Atlas cluster in MONGODB_URI.
  mongo:
    image: mongo:8.0
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "${PC_MONGO_PORT:-27027}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first start, then reports healthy once it has a primary
      # (throwing makes mongosh exit non-zero; a falsy result alone would not).
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }) } if (!db.hello().isWritablePrimary) throw new Error('no primary yet')"
      interval: 3s
      timeout: 10s
      retries: 30

volumes:
  mongo-data:
