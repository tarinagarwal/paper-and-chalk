# Local services for Paper & Chalk (SPEC.md section 2 stand-ins).
# Host ports are chosen to avoid clashing with other local Postgres/Redis containers.
name: paper-chalk

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_USER: pc
      POSTGRES_PASSWORD: pc
      POSTGRES_DB: paper_chalk
    ports:
      - "${PC_POSTGRES_PORT:-54320}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pc -d paper_chalk"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${PC_REDIS_PORT:-63790}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  gcs:
    image: fsouza/fake-gcs-server:1.52
    # Each directory under /data becomes a bucket at startup; objects persist in /storage.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mkdir -p /data/originals /data/yjs-snapshots /data/assets /data/exports /data/thumbnails &&
        exec /bin/fake-gcs-server -data /data -backend filesystem -filesystem-root /storage
        -scheme http -port 4443 -external-url http://localhost:${PC_GCS_PORT:-4443}
    ports:
      - "${PC_GCS_PORT:-4443}:4443"
    volumes:
      - gcs-data:/storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4443/storage/v1/b"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  redis-data:
  gcs-data:
