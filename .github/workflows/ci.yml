name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mongo:
        image: mongo:8.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 3s --health-timeout 5s --health-retries 30

    env:
      MONGODB_TEST_URI: mongodb://localhost:27017/paper_chalk_test
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Restore Turborepo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm turbo run test

      - name: Build
        run: pnpm turbo run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mongo:
        image: mongo:8.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 3s --health-timeout 5s --health-retries 30
    env:
      # The Playwright config points the server at the throwaway database, a memory rate limiter
      # and a file outbox. The rest only has to pass startup validation.
      E2E_MONGODB_URI: mongodb://localhost:27017/paper_chalk_e2e
      MONGODB_URI: mongodb://localhost:27017/paper_chalk_e2e
      BETTER_AUTH_SECRET: ci-only-auth-secret-not-used-anywhere-else-0001
      BETTER_AUTH_URL: http://localhost:3100
      SYNC_JWT_SECRET: ci-only-sync-secret-not-used-anywhere-else-0001
      UPSTASH_REDIS_REST_URL: https://ci.invalid.upstash.io
      UPSTASH_REDIS_REST_TOKEN: ci-not-used
      RATE_LIMIT_STORE: memory
      EMAIL_DELIVERY: outbox
      GCS_PROJECT_ID: paper-chalk-ci
      GCS_BUCKET_ORIGINALS: originals
      GCS_BUCKET_YJS_SNAPSHOTS: yjs-snapshots
      GCS_BUCKET_ASSETS: assets
      GCS_BUCKET_EXPORTS: exports
      GCS_BUCKET_THUMBNAILS: thumbnails
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @pc/web exec playwright install --with-deps chromium

      - name: Build web
        run: pnpm turbo run build --filter=@pc/web

      - name: Run Playwright
        run: pnpm --filter @pc/web e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  docker:
    name: Docker image (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [web, sync, workers]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          tags: paper-chalk-${{ matrix.app }}:ci
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
